name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: trading
          POSTGRES_DB: trading
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading -d trading"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://trading:trading@localhost:5432/trading_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Test
        run: pytest -q
      - name: Coverage
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=70

  frontend:
    name: frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build

  compose:
    name: compose smoke (6 services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build and start
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
      - name: Probe API
        run: |
          body="$(curl -fsS localhost:8000/health)"
          echo "$body"
          [[ "$body" == *'"status":"ok"'* ]]
      - name: Probe web
        run: |
          code="$(curl -fsS -o /dev/null -w '%{http_code}' localhost:5173)"
          echo "web status: $code"
          [[ "$code" == "200" ]]
          curl -fsS localhost:5173 | grep -q '<title>trading</title>'
      - name: Verify six services are running
        run: |
          docker compose ps --format json | python3 -c '
          import json, sys
          services = {}
          for line in sys.stdin.read().splitlines():
              if line.strip():
                  row = json.loads(line)
                  services[row["Service"]] = row["State"]
          expected = {"postgres", "redis", "api", "worker", "scheduler", "web"}
          missing = expected - services.keys()
          assert not missing, f"missing services: {missing}"
          not_running = {name: state for name, state in services.items() if "running" not in state}
          assert not not_running, f"not running: {not_running}"
          print(services)
          '
      - name: Verify scheduler liveness probe
        run: docker compose exec -T scheduler python -m app.jobs.probe scheduler
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=150
      - name: Tear down
        if: always()
        run: docker compose down -v
