[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "trading-backend"
version = "0.2.0"
description = "trading backend — 单进程 FastAPI + 同步 SQLAlchemy + SQLite"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2.0",
  # 外部 HTTP 只在交易所适配层使用（OKX 公共 REST）。
  "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# B008：FastAPI 的 Depends()/Query() 以默认值形式出现，属误报
# RUF002/RUF003：本项目文档与注释使用中文全角标点，属预期
ignore = ["B008", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
