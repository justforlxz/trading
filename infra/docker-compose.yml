# 六个运行服务：postgres、redis、api、worker、scheduler、web（overview §5）。
# 另有 `api-dev`（profile=dev），只供本地门禁命令使用，不属于运行拓扑。
# 容器间只有两种通信：API 对外、DB/Redis 共享；服务之间不互相 HTTP 调用。
name: trading

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-trading}:${POSTGRES_PASSWORD:-trading}@postgres:5432/${POSTGRES_DB:-trading}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  SCHEDULER_HEARTBEAT_INTERVAL_SECONDS: ${SCHEDULER_HEARTBEAT_INTERVAL_SECONDS:-5}
  SCHEDULER_HEARTBEAT_TIMEOUT_SECONDS: ${SCHEDULER_HEARTBEAT_TIMEOUT_SECONDS:-30}
  # P3 交易执行：真实交易默认关闭；凭据只从环境变量注入，缺省为空。
  REAL_TRADING_ENABLED: ${REAL_TRADING_ENABLED:-false}
  OKX_API_KEY: ${OKX_API_KEY:-}
  OKX_API_SECRET: ${OKX_API_SECRET:-}
  OKX_API_PASSPHRASE: ${OKX_API_PASSPHRASE:-}
  EXECUTION_REAL_STRATEGY_IDS: ${EXECUTION_REAL_STRATEGY_IDS:-}
  EXECUTION_PAPER_FILL_CHUNKS: ${EXECUTION_PAPER_FILL_CHUNKS:-0.5,0.5}
  EXECUTION_STOP_LOSS_RATIO: ${EXECUTION_STOP_LOSS_RATIO:-0.05}

x-backend-service: &backend-service
  image: trading-api:local
  restart: unless-stopped
  environment: *backend-env

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading}
      POSTGRES_DB: ${POSTGRES_DB:-trading}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading} -d ${POSTGRES_DB:-trading}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    <<: *backend-service
    build:
      context: ../backend
      target: runtime
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "1"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  worker:
    <<: *backend-service
    command: ["arq", "app.jobs.worker.WorkerSettings"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.jobs.probe", "worker"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  scheduler:
    <<: *backend-service
    command: ["python", "-m", "app.jobs.scheduler"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.jobs.probe", "scheduler"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    image: trading-web:local
    build:
      context: ../frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # 仅供 `make test|lint|format` 使用的开发镜像（`dev` profile）。
  # `docker compose up` 不会启动它；它挂载工作区源码，因此跑的是当前工作树。
  api-dev:
    profiles: ["dev"]
    image: trading-api-dev:local
    build:
      context: ../backend
      target: dev
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "0"
    volumes:
      - ../backend:/srv
    working_dir: /srv
    command: ["pytest", "-q"]

volumes:
  pgdata:
  redisdata:

