# Alembic 迁移配置。
#
# 用 `python -m alembic upgrade head`（cwd = backend/）或 `make migrate`；
# 应用启动时 `app.db.init_db()` 走的是同一份配置。
#
# 这里不写 `sqlalchemy.url`：连接串的唯一真源是 `app.config.Settings.database_url`，
# 迁移环境直接用应用自己的引擎，因此 `DATABASE_URL` / `DATABASE_SCHEMA` 对迁移和
# 业务代码总是同一份值。
#
# `%(here)s` 由 Alembic 解析成 ini 文件所在目录，脚本位置因此与进程 cwd 无关。

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
# 迁移文件名带序号前缀（0001_initial_schema.py），按顺序读即按顺序执行。
file_template = %%(rev)s_%%(slug)s
# 版本号用四位序号：迁移链只有一条，人读的时候顺序比随机哈希更有用。
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
